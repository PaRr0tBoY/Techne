<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Skills Collection</title>
  <desc id="hero-desc">A multi-skill repository for AI agents, featuring Vivaldi browser control with 600+ preference paths and live CDP apply.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#141a22"/>
    </linearGradient>
    <clipPath id="term-clip">
      <rect x="640" y="40" width="512" height="300" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="14" fill="url(#bg-grad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#dce4ec" stroke-width="1">
    <line x1="610" y1="0" x2="610" y2="380"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
  </g>

  <!-- Left: Title block -->
  <g transform="translate(64, 56)">
    <!-- Category -->
    <rect width="130" height="22" rx="4" fill="#3e4b3f" opacity="0.5"/>
    <text x="65" y="15" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" font-weight="600" letter-spacing="1.5"
          fill="#8fa88f">AI AGENT SKILLS</text>

    <!-- Title -->
    <text y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="42" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">
      Skills Collection
    </text>

    <!-- Subtitle -->
    <text y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="17" fill="#7a8599">
      Modular skill repository for AI agents
    </text>

    <!-- Accent line -->
    <rect y="122" width="48" height="3" rx="1.5" fill="#3e4b3f"/>

    <!-- Description -->
    <text y="158" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14.5" fill="#8b98ac">
      Control browsers, automate workflows,
    </text>
    <text y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14.5" fill="#8b98ac">
      extend agent capabilities.
    </text>

    <!-- Stats row -->
    <g transform="translate(0, 216)">
      <!-- Stat 1 -->
      <g>
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="20" font-weight="700" fill="#e6edf3">2</text>
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="11" fill="#7a8599">Skills</text>
      </g>
      <!-- Stat 2 -->
      <g transform="translate(80, 0)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="20" font-weight="700" fill="#e6edf3">4</text>
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="11" fill="#7a8599">Scripts</text>
      </g>
      <!-- Stat 3 -->
      <g transform="translate(160, 0)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="20" font-weight="700" fill="#c4955e">600+</text>
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="11" fill="#7a8599">Pref Paths</text>
      </g>
      <!-- Stat 4 -->
      <g transform="translate(280, 0)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="20" font-weight="700" fill="#3e4b3f">Live</text>
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="11" fill="#7a8599">CDP Apply</text>
      </g>
    </g>
  </g>

  <!-- Right: Terminal card -->
  <g transform="translate(640, 40)">
    <!-- Card background -->
    <rect width="512" height="300" rx="10" fill="#161b22" stroke="#2a3140" stroke-width="1"/>

    <!-- Title bar -->
    <rect width="512" height="32" rx="10" fill="#1c2230"/>
    <rect y="10" width="512" height="22" fill="#1c2230"/>
    <!-- Traffic lights -->
    <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="16" r="5" fill="#febc2e"/>
    <circle cx="54" cy="16" r="5" fill="#28c840"/>
    <!-- Tab label -->
    <text x="256" y="20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#5a6577">terminal</text>

    <!-- Terminal content -->
    <g transform="translate(20, 52)">
      <!-- Install command -->
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3e4b3f">
        <tspan fill="#5a6577">$</tspan>
        <tspan fill="#dce4ec" dx="6">npx skills add PaRr0tBoY/</tspan>
      </text>
      <text y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#dce4ec">
        vivaldi-browser-skill/skills/vivaldi-browser
      </text>
      <text y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3e4b3f">
        ✓ Added vivaldi-browser
      </text>

      <!-- Blank line -->
      <!-- Directory tree -->
      <text y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        skills/
      </text>
      <text y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        └── <tspan fill="#c4955e">vivaldi-browser</tspan>/
      </text>
      <text y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        │   ├── <tspan fill="#dce4ec">SKILL.md</tspan>
      </text>
      <text y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        │   ├── <tspan fill="#8b98ac">scripts/</tspan>
      </text>
      <text y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        │   │   ├── prefs.mjs
      </text>
      <text y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        │   │   ├── shortcuts.mjs
      </text>
      <text y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        │   │   ├── data.mjs
      </text>
      <text y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        │   │   └── cdp-client.mjs
      </text>
      <text y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        │   └── <tspan fill="#8b98ac">references/</tspan>
      </text>
      <!-- Cursor -->
      <text y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a6577">
        <tspan fill="#5a6577">$</tspan>
        <tspan fill="#3e4b3f" dx="6">█</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom accent bar -->
  <rect x="64" y="348" width="1072" height="1" rx="0.5" fill="#2a3140" opacity="0.5"/>
</svg>
